<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>BudgetBakers</title>

<meta name="apple-mobile-web-app-title"
      content="BudgetBakers">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="theme-color" content="#ffffff">

<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    background:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.box {
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

button {
    padding:14px 22px;
    border:0;
    border-radius:12px;
    font-size:17px;
}

/* Mode aplikasi (dibuka dari Home Screen): iframe layar penuh */
#wrap{
    display:none;
    position:fixed;
    inset:0;
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:#fff;
}
#app{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#fff;
}
body.standalone{overflow:hidden}
body.standalone .box{display:none}
body.standalone #wrap{display:block}
</style>

<script>
const APP_URL =
    "https://script.google.com/macros/s/AKfycbyneDtjblJQ2MSMoxptVF69b4AcPRE1gwpgi82Z4Ebko4go6rQzdWJyrAZczYtP3HtK/exec";

const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

if (standalone) {
    // Dibuka dari Home Screen: tampilkan aplikasi di dalam halaman ini
    // (tidak pindah domain, supaya tidak muncul toolbar Safari).
    document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("standalone");
        document.getElementById("app").src = APP_URL;
    });
}
// Dibuka di Safari biasa: tetap di halaman petunjuk ini
// sehingga ada waktu untuk Add to Home Screen.
</script>

</head>

<body>

<div class="box">
    <div>
        <h2>BudgetBakers</h2>
        <p>Tambahkan ke Layar Utama untuk menggunakannya seperti aplikasi.</p>
    </div>
</div>

<div id="wrap">
    <iframe id="app" title="BudgetBakers" allow="clipboard-write; clipboard-read"></iframe>
</div>

</body>
</html>
